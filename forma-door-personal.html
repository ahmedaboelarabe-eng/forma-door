<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA DOOR - حسابي والتتبع</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f1eb;color:#2d2119}.top{background:#3a2418;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px #0001}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0}.btn{border:0;border-radius:10px;padding:11px 15px;background:#4a2c1d;color:#fff;cursor:pointer}.timeline{border-right:3px solid #8a674b;padding-right:18px}.event{background:#fff;padding:12px;border-radius:12px;margin:10px 0}.stat{font-size:25px;font-weight:bold}</style></head><body><div class="top"><div class="wrap"><h1>FORMA DOOR</h1><div>حسابي الشخصي والتتبع</div></div></div><main class="wrap"><div class="grid"><section class="card"><h2>حسابي الشخصي</h2><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الجوال"><input id="role" placeholder="الوظيفة / الدور"><textarea id="notes" placeholder="ملاحظات شخصية"></textarea><button class="btn" onclick="save()">حفظ</button></section><section class="card"><h2>ملخصي</h2><div>إجمالي قيمة الطلبات</div><div class="stat" id="sales">0 ريال</div><div>المدفوع</div><div class="stat" id="paid">0 ريال</div><div>المتبقي</div><div class="stat" id="remain">0 ريال</div></section></div><section class="card" style="margin-top:18px"><h2>تتبع الطلبات</h2><input id="search" placeholder="ابحث برقم الطلب أو اسم العميل" oninput="render()"><div id="tracking"></div></section></main><script>const sample=[{no:'FD-1001',customer:'عميل تجريبي',product:'باب WPC مودرن',total:1200,paid:500,status:'قيد التصنيع',events:[['تم إنشاء الطلب','01/10/2026'],['تم تسجيل الدفعة','01/10/2026'],['أرسل للمصنع','01/10/2026'],['قيد التصنيع','02/10/2026']]}];function save(){localStorage.setItem('formaPersonal',JSON.stringify({name:name.value,phone:phone.value,role:role.value,notes:notes.value}));alert('تم الحفظ')}function load(){let x=JSON.parse(localStorage.getItem('formaPersonal')||'{}');name.value=x.name||'';phone.value=x.phone||'';role.value=x.role||'';notes.value=x.notes||''}function render(){let q=(search.value||'').toLowerCase();let a=sample.filter(x=>(x.no+x.customer+x.product).toLowerCase().includes(q));tracking.innerHTML=a.map(x=>`<div class="event"><b>${x.no}</b> — ${x.customer}<br>${x.product}<br>الحالة: <b>${x.status}</b><br>الإجمالي: ${x.total} ريال | المدفوع: ${x.paid} ريال | المتبقي: ${Math.max(0,x.total-x.paid)} ريال<div class="timeline">${x.events.map(e=>`<div class="event">✓ ${e[0]}<br><small>${e[1]}</small></div>`).join('')}</div></div>`).join('')||'<p>لا توجد نتائج</p>';sales.textContent=sample.reduce((s,x)=>s+x.total,0)+' ريال';paid.textContent=sample.reduce((s,x)=>s+x.paid,0)+' ريال';remain.textContent=sample.reduce((s,x)=>s+Math.max(0,x.total-x.paid),0)+' ريال'}load();render();</script></body></html>
