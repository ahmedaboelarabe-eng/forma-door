<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA DOOR - المعرض</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f1eb;color:#2d2119}.top{background:#3a2418;color:#fff;padding:20px}.top h1{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:14px;box-shadow:0 4px 16px #0001}.door{height:230px;border-radius:12px;background:linear-gradient(135deg,#6f4a2f,#b68b5d);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#4a2c1d;color:#fff;cursor:pointer;margin:4px}.btn.light{background:#eee;color:#333}.box{background:#fff;border-radius:16px;padding:18px;margin-top:20px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px}#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:30px}.noPrint{display:none!important}}</style></head><body><div class="top"><div class="wrap"><h1>FORMA DOOR</h1><div>المعرض + طباعة الفاتورة</div></div></div><main class="wrap"><div class="grid" id="gallery"></div><section class="box"><h2>فاتورة للطباعة</h2><div class="row"><input id="inv" placeholder="رقم الفاتورة"><input id="customer" placeholder="اسم العميل"><input id="phone" placeholder="رقم الجوال"><input id="product" placeholder="المنتج / الموديل"><input id="qty" type="number" value="1" placeholder="الكمية"><input id="price" type="number" value="0" placeholder="سعر الوحدة"><input id="discount" type="number" value="0" placeholder="الخصم"><input id="paid" type="number" value="0" placeholder="المدفوع"><input id="due" type="date"><input id="notes" placeholder="ملاحظات"></div><p>الإجمالي: <b id="total">0</b> ريال — المتبقي: <b id="remaining">0</b> ريال</p><button class="btn" onclick="printInvoice()">🖨️ طباعة الفاتورة</button><button class="btn light" onclick="clearForm()">مسح</button></section></main><div id="printArea"></div><script>const products=[['باب WPC موديل كلاسيك','بني خشبي'],['باب WPC موديل مودرن','بني داكن'],['باب WPC موديل فاخر','خشبي فاتح'],['باب خارجي','لون حسب الطلب'],['باب داخلي','ألوان متعددة'],['إطار WPC','حسب المقاس']];const gallery=document.getElementById('gallery');products.forEach((p,i)=>{gallery.innerHTML+=`<div class="card"><div class="door">${p[0]}</div><h3>${p[0]}</h3><p>${p[1]}</p><button class="btn" onclick="choose('${p[0]}')">اختيار للطلب</button></div>`});function choose(x){document.getElementById('product').value=x;document.querySelector('.box').scrollIntoView({behavior:'smooth'})}function calc(){let q=+qty.value||0,p=+price.value||0,d=+discount.value||0,pa=+paid.value||0;let t=Math.max(0,q*p-d),r=Math.max(0,t-pa);total.textContent=t.toFixed(2);remaining.textContent=r.toFixed(2)}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));function printInvoice(){calc();let t=+total.textContent,r=+remaining.textContent;printArea.innerHTML=`<h1>FORMA DOOR</h1><h2>فاتورة</h2><hr><p><b>رقم الفاتورة:</b> ${inv.value||'-'}</p><p><b>العميل:</b> ${customer.value||'-'}</p><p><b>الجوال:</b> ${phone.value||'-'}</p><p><b>المنتج:</b> ${product.value||'-'}</p><p><b>الكمية:</b> ${qty.value}</p><p><b>سعر الوحدة:</b> ${price.value} ريال</p><p><b>الخصم:</b> ${discount.value} ريال</p><h3>الإجمالي النهائي: ${t.toFixed(2)} ريال</h3><p><b>المدفوع:</b> ${paid.value} ريال</p><p><b>المتبقي:</b> ${r.toFixed(2)} ريال</p><p><b>تاريخ الاستحقاق:</b> ${due.value||'-'}</p><p><b>ملاحظات:</b> ${notes.value||'-'}</p><hr><p>شكراً لتعاملكم مع FORMA DOOR</p>`;window.print()}function clearForm(){document.querySelectorAll('input').forEach(x=>{if(x.id==='qty')x.value=1;else if(['price','discount','paid'].includes(x.id))x.value=0;else x.value=''});calc()}calc();</script></body></html>
