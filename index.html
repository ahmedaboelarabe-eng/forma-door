<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELARBE - Forma Door</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#171717;
    color:white;
    padding:20px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

.brand{
    color:#c49a6c;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px #00000012;
}

.card-title{
    color:#777;
    margin-bottom:10px;
}

.number{
    font-size:28px;
    font-weight:bold;
    color:#8b5e3c;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
}

.button{
    background:white;
    border:0;
    padding:25px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 3px 12px #00000012;
}

.button:hover{
    background:#8b5e3c;
    color:white;
}

#customers{
    display:none;
    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px #00000012;
}

input,textarea{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

textarea{
    height:90px;
    resize:none;
}

.save{
    background:#8b5e3c;
    color:white;
    border:0;
    padding:13px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

#customerList{
    margin-top:25px;
}

.customer{
    border:1px solid #eee;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    background:#fafafa;
}

footer{
    text-align:center;
    color:#888;
    padding:35px;
}

@media(max-width:700px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ELARBE</div>
    <div class="brand">FORMA DOOR</div>
</header>

<div class="container">

<h1>لوحة التحكم</h1>
<p>نظام إدارة معرض فورما دور</p>

<div class="cards">

<div class="card">
<div class="card-title">العملاء</div>
<div class="number" id="customerCount">0</div>
</div>

<div class="card">
<div class="card-title">الطلبات</div>
<div class="number">0</div>
</div>

<div class="card">
<div class="card-title">الفواتير</div>
<div class="number">0</div>
</div>

<div class="card">
<div class="card-title">المدفوعات</div>
<div class="number">0 ريال</div>
</div>

</div>

<div class="menu">

<button class="button" onclick="showCustomers()">👤 العملاء</button>
<button class="button">📦 الطلبات</button>
<button class="button">🧾 الفواتير</button>
<button class="button">💰 المدفوعات</button>
<button class="button">🏭 المصنع</button>
<button class="button">⚙️ الإعدادات</button>

</div>

<div id="customers">

<h2>إضافة عميل جديد</h2>

<input id="customerName" placeholder="اسم العميل">

<input id="customerPhone" placeholder="رقم الجوال">

<input id="customerIdNumber" placeholder="رقم الهوية">

<input id="customerAddress" placeholder="الموقع / العنوان">

<input id="customerEmail" placeholder="البريد الإلكتروني">

<textarea id="customerNotes" placeholder="ملاحظات"></textarea>

<button class="save" onclick="saveCustomer()">حفظ العميل</button>

<div id="customerList"></div>

</div>

</div>

<footer>
ELARBE © 2026 - Forma Door
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hbjtldjytbhfyttltnur.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z0evRtHQkpx1NVoWjvJ9wg_jkqnEqjX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function showCustomers(){

    document.getElementById("customers").style.display = "block";

    loadCustomers();
}

async function saveCustomer(){

    const name =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    const idNumber =
        document.getElementById("customerIdNumber").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    const email =
        document.getElementById("customerEmail").value.trim();

    const notes =
        document.getElementById("customerNotes").value.trim();

    if(!name){

        alert("اكتب اسم العميل أولاً");
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("customers")
        .insert([
            {
                name:name,
                phone:phone,
                id_number:idNumber,
                address:address,
                email:email,
                notes:notes
            }
        ])
        .select();

    if(error){

        alert("حدث خطأ: " + error.message);
        console.error(error);
        return;
    }

    alert("تم حفظ العميل بنجاح");

    document.getElementById("customerName").value="";
    document.getElementById("customerPhone").value="";
    document.getElementById("customerIdNumber").value="";
    document.getElementById("customerAddress").value="";
    document.getElementById("customerEmail").value="";
    document.getElementById("customerNotes").value="";

    loadCustomers();
}

async function loadCustomers(){

    const { data, error } =
        await supabaseClient
        .from("customers")
        .select("id,name,phone,id_number,address,email,notes");

    if(error){

        console.error(error);
        return;
    }

    document.getElementById("customerCount").textContent =
        data.length;

    const list =
        document.getElementById("customerList");

    list.innerHTML = "<h3>العملاء</h3>";

    data.forEach(customer => {

        list.innerHTML += `
        <div class="customer">
            <strong>${customer.name || ""}</strong><br>
            📱 ${customer.phone || ""}<br>
            🪪 ${customer.id_number || ""}<br>
            📍 ${customer.address || ""}<br>
            ✉️ ${customer.email || ""}<br>
            📝 ${customer.notes || ""}
        </div>
        `;

    });
}

</script>

</body>
</html>
