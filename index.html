<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELARBE - Forma Door</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #171717;
    color: white;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.brand {
    color: #c49a6c;
    font-size: 15px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #777;
    margin-top: 8px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card-title {
    color: #777;
    margin-bottom: 12px;
}

.number {
    font-size: 30px;
    font-weight: bold;
    color: #8b5e3c;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.button {
    border: none;
    background: white;
    padding: 25px;
    border-radius: 15px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.button:hover {
    background: #8b5e3c;
    color: white;
}

#customers {
    display: none;
    background: white;
    margin-top: 25px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.save {
    background: #8b5e3c;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}

footer {
    text-align: center;
    color: #888;
    padding: 35px;
}

@media (max-width: 700px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ELARBE</div>
    <div class="brand">FORMA DOOR</div>
</header>

<div class="container">

    <h1>لوحة التحكم</h1>
    <div class="subtitle">نظام إدارة معرض فورما دور</div>

    <div class="cards">

        <div class="card">
            <div class="card-title">العملاء</div>
            <div class="number">0</div>
        </div>

        <div class="card">
            <div class="card-title">الطلبات</div>
            <div class="number">0</div>
        </div>

        <div class="card">
            <div class="card-title">الفواتير</div>
            <div class="number">0</div>
        </div>

        <div class="card">
            <div class="card-title">المدفوعات</div>
            <div class="number">0 ريال</div>
        </div>

    </div>

    <div class="menu">

        <button class="button" onclick="showCustomers()">
            👤 العملاء
        </button>

        <button class="button">
            📦 الطلبات
        </button>

        <button class="button">
            🧾 الفواتير
        </button>

        <button class="button">
            💰 المدفوعات
        </button>

        <button class="button">
            🏭 المصنع
        </button>

        <button class="button">
            ⚙️ الإعدادات
        </button>

    </div>

    <div id="customers">

        <h2>إضافة عميل جديد</h2>

        <input id="customerName" type="text" placeholder="اسم العميل">

        <input id="customerPhone" type="text" placeholder="رقم الجوال">

        <input id="customerAddress" type="text" placeholder="العنوان">

        <input id="customerId" type="text" placeholder="رقم الهوية">

        <button class="save" onclick="saveCustomer()">
            حفظ العميل
        </button>

    </div>

</div>

<footer>
    ELARBE © 2026 - Forma Door
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hbjtldjytbhfyttltnur.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z0evRtHQkpx1NVoWjvJ9wg_jkqnEqjX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function showCustomers() {
    document.getElementById("customers").style.display = "block";
}

async function saveCustomer() {

    const name =
        document.getElementById("customerName").value;

    const phone =
        document.getElementById("customerPhone").value;

    const address =
        document.getElementById("customerAddress").value;

    const idNumber =
        document.getElementById("customerId").value;

    if (!name) {
        alert("اكتب اسم العميل أولاً");
        return;
    }

    const { error } = await supabaseClient
        .from("customers")
        .insert([
            {
                name: name,
                phone: phone,
                address: address,
                id_number: idNumber
            }
        ]);

    if (error) {
        alert("حدث خطأ أثناء حفظ العميل");
        console.error(error);
        return;
    }

    alert("تم حفظ العميل بنجاح");

    document.getElementById("customerName").value = "";
    document.getElementById("customerPhone").value = "";
    document.getElementById("customerAddress").value = "";
    document.getElementById("customerId").value = "";
}

</script>

</body>
</html>
