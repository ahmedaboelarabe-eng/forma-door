<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS - Forma Door</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

header{
    background:#171717;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

.brand{
    color:#c49a6c;
    font-size:14px;
}

.container{
    padding:25px;
    max-width:1200px;
    margin:auto;
}

h1{
    margin-top:0;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
    margin:0 0 10px;
    color:#777;
    font-size:15px;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:#8b5e3c;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
}

.button{
    background:white;
    border:0;
    padding:25px;
    border-radius:14px;
    text-align:center;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.button:hover{
    background:#8b5e3c;
    color:white;
}

footer{
    text-align:center;
    padding:35px;
    color:#888;
}

@media(max-width:700px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ATLAS</div>
    <div class="brand">FORMA DOOR</div>
</header>

<div class="container">

    <h1>لوحة التحكم</h1>
    <p>نظام إدارة معرض فورما دور</p>

    <div class="cards">

        <div class="card">
            <h3>العملاء</h3>
            <div class="number">0</div>
        </div>

        <div class="card">
            <h3>الطلبات</h3>
            <div class="number">0</div>
        </div>

        <div class="card">
            <h3>الفواتير</h3>
            <div class="number">0</div>
        </div>

        <div class="card">
            <h3>المدفوعات</h3>
            <div class="number">0 ريال</div>
        </div>

    </div>

    <div class="menu">

        <button class="button" onclick="showCustomers()">👤 العملاء</button>
        <button class="button">📦 الطلبات</button>

        <button class="button">🧾 الفواتير</button>

        <button class="button">💰 المدفوعات</button>

        <button class="button">🏭 المصنع</button>

        <button class="button">⚙️ الإعدادات</button>

    </div>

</div>

<footer>
    ATLAS © 2026 - Forma Door
</footer>
<script>
function showCustomers(){
    alert("صفحة العملاء - هنربطها بقاعدة البيانات في الخطوة التالية");
}
</script>
</body>
</html>
